services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    command: ["npm", "run", "db:migrate"]
    networks:
      - backend
      - egress
    restart: "no"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - backend
      - frontend
    command: ["npm", "run", "start"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/api/health >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 768M

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    command: ["npm", "run", "worker"]
    networks:
      - backend
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  cron:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    command: ["sh", "scripts/cron.sh"]
    environment:
      CRON_BASE_URL: http://web:3000
    networks:
      - backend
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: 128M

networks:
  backend:
    external: true
    name: vps_backend
  egress:
    external: true
    name: vps_egress
  frontend:
    external: true
    name: vps_frontend
